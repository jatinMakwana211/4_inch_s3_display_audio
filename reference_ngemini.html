<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voice Concierge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: #f8fafc;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .chat-container::-webkit-scrollbar { width: 6px; }
        .chat-container::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

        .bubble-user {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border-radius: 18px 18px 2px 18px;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
        }
        .bubble-ai {
            background: rgba(255, 255, 255, 0.07);
            border-radius: 18px 18px 18px 2px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .pulse-red { animation: pulse 1.5s infinite; }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .hidden-section { display: none !important; }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <!-- REGISTRATION CARD -->
    <div id="setupSection" class="w-full max-w-md glass p-8 rounded-3xl shadow-2xl transition-all duration-500">
        <div class="text-center mb-8">
            <div class="bg-blue-500 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-blue-500/50">
                <i class="fas fa-robot text-2xl text-white"></i>
            </div>
            <h1 class="text-3xl font-bold tracking-tight">GEMINI Voice Assistant</h1>
            <p class="text-slate-400 mt-2">Enter details to start the experience</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase ml-1 mb-1">Full Name</label>
                <input type="text" id="userName" class="w-full bg-slate-800/50 border border-slate-700 rounded-xl px-4 py-3 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all"  >
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase ml-1 mb-1">Email</label>
                <input type="email" id="userEmail" class="w-full bg-slate-800/50 border border-slate-700 rounded-xl px-4 py-3 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all"  >
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase ml-1 mb-1">Mobile</label>
                <input type="text" id="userMobile" class="w-full bg-slate-800/50 border border-slate-700 rounded-xl px-4 py-3 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all" >
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase ml-1 mb-1">Language</label>
                <select id="language" class="w-full bg-slate-800/50 border border-slate-700 rounded-xl px-4 py-3 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all">
                    <option value="English">English</option>
                    <option value="Hindi">Hindi</option>
                    <option value="Gujarati">Gujarati</option>
                </select>
            </div>

            <!-- CONTEXT FILE DROPDOWN & BUTTONS -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase ml-1 mb-1">Context File (Optional)</label>
                <div class="flex items-center gap-2 w-full">
                    <select id="contextFile" class="flex-1 min-w-0 w-full bg-slate-800/50 border border-slate-700 rounded-xl px-3 py-3 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all text-sm truncate">
                        <option value="">No Context File (Optional)</option>
                    </select>
                    <!-- UPLOAD/MANAGE BUTTON -->
                    <button type="button" onclick="openUploadModal()" title="Manage Context Files"
                        class="flex-shrink-0 bg-slate-800/50 border border-slate-700 rounded-xl px-4 py-3 text-slate-400 hover:text-green-400 hover:border-green-500 transition-all">
                        <i class="fas fa-upload"></i>
                    </button>
                    <button type="button" id="refreshFilesBtn" title="Refresh file list"
                        class="flex-shrink-0 bg-slate-800/50 border border-slate-700 rounded-xl px-4 py-3 text-slate-400 hover:text-blue-400 hover:border-blue-500 transition-all">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>
            </div>

            <button onclick="connect()" id="connectBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-600/30 transition-all transform active:scale-95">
                Initialize Session
            </button>
        </div>
    </div>

    <!-- CHAT INTERFACE (Hidden initially) -->
    <div id="chatSection" class="hidden-section w-full max-w-2xl glass rounded-3xl shadow-2xl flex flex-col h-[85vh]">
        <!-- Header -->
        <div class="p-6 border-b border-white/10 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="relative">
                    <div class="w-12 h-12 bg-gradient-to-tr from-blue-500 to-emerald-400 rounded-full flex items-center justify-center">
                        <i class="fas fa-headset text-white"></i>
                    </div>
                    <div id="statusDot" class="absolute bottom-0 right-0 w-3 h-3 bg-slate-500 border-2 border-slate-900 rounded-full"></div>
                </div>
                <div>
                    <h2 id="displaySite" class="font-bold text-lg leading-none">AI Concierge</h2>
                    <span id="statusText" class="text-sm text-slate-400">Disconnected</span>
                </div>
            </div>
            <button onclick="disconnect()" class="px-4 py-2 bg-red-500/10 hover:bg-red-500/20 text-red-400 rounded-lg text-sm font-bold transition-all">
                Disconnect
            </button>
        </div>

        <!-- Chat Area -->
        <div id="chatBox" class="chat-container flex-1 overflow-y-auto p-6 space-y-6">
            <!-- Bubbles will appear here -->
        </div>

        <!-- Visualizer Area -->
        <div id="visualizer" class="h-16 flex items-center justify-center gap-1 mb-2 hidden">
            <div class="w-1 bg-blue-500 h-2 rounded-full animate-bounce"></div>
            <div class="w-1 bg-blue-400 h-4 rounded-full animate-bounce" style="animation-delay: 0.1s"></div>
            <div class="w-1 bg-blue-300 h-6 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
            <div class="w-1 bg-blue-400 h-4 rounded-full animate-bounce" style="animation-delay: 0.3s"></div>
            <div class="w-1 bg-blue-500 h-2 rounded-full animate-bounce" style="animation-delay: 0.4s"></div>
        </div>

        <!-- Controls -->
        <div class="p-8 border-t border-white/10 text-center">
            <button id="micBtn" onclick="toggleMic()" class="w-20 h-20 rounded-full bg-slate-700 hover:bg-slate-600 flex items-center justify-center mx-auto transition-all shadow-xl disabled:opacity-50 disabled:cursor-not-allowed">
                <i id="micIcon" class="fas fa-microphone text-3xl text-white"></i>
            </button>
            <p id="micHint" class="mt-4 text-slate-400 font-medium">Click to start conversation</p>
        </div>
    </div>

    <!-- ADVANCED UPLOAD & MANAGER MODAL POP-UP -->
    <div id="uploadModal" class="hidden-section fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm p-4">
        <div class="glass w-full max-w-2xl rounded-3xl p-6 shadow-2xl relative border border-white/10 max-h-[90vh] flex flex-col">
            <button type="button" id="closeUploadModalBtn" class="absolute top-5 right-5 text-slate-400 hover:text-white transition-all z-10">
                <i class="fas fa-times text-xl"></i>
            </button>
            <h2 class="text-xl font-bold mb-4 flex items-center gap-2 flex-shrink-0"><i class="fas fa-cloud-upload-alt text-blue-500"></i> Upload Manager</h2>
            
            <div class="overflow-y-auto pr-2 chat-container flex-1">
                <!-- Dropzone Area -->
                <label id="dropZone" class="block border-2 border-dashed border-slate-600 rounded-2xl p-8 text-center cursor-pointer hover:border-blue-500 hover:bg-slate-800/50 transition-all mb-4 relative overflow-hidden">
                    <div class="text-blue-500 text-4xl mb-3"><i class="fas fa-file-upload"></i></div>
                    <b class="block text-slate-300 text-sm">Drop a file here or click to browse</b>
                    <input type="file" id="modalFileInput" class="hidden">
                </label>

                <!-- Selected File Display -->
                <div id="selectedFileDiv" class="hidden items-center gap-3 bg-slate-800/80 p-3 rounded-xl mb-4 border border-slate-700">
                    <div class="w-10 h-10 bg-purple-500/20 text-purple-400 rounded-lg flex items-center justify-center flex-shrink-0"><i class="fas fa-file-alt"></i></div>
                    <div class="flex-1 overflow-hidden">
                        <div id="modalSelName" class="text-sm font-semibold truncate text-slate-200">file.txt</div>
                        <div id="modalSelSize" class="text-xs text-slate-400">0 KB</div>
                    </div>
                    <button type="button" id="modalUploadBtn" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-bold transition-all shadow-lg">Upload</button>
                    <button type="button" id="modalClearBtn" class="text-slate-400 hover:text-red-400 p-2"><i class="fas fa-trash"></i></button>
                </div>

                <div id="uploadMsg" class="hidden p-3 rounded-xl text-sm font-medium text-center mb-4"></div>

                <!-- Files List Section -->
                <div class="mt-6 mb-3 flex items-center justify-between">
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-2">
                        Uploaded Files <span id="modalFileCount" class="bg-blue-500/20 text-blue-400 px-2 py-0.5 rounded-full text-[10px]">0</span>
                    </h3>
                    <button type="button" onclick="fetchAndRenderFiles()" class="text-slate-400 hover:text-white text-xs transition-all"><i class="fas fa-sync-alt"></i> Refresh</button>
                </div>
                
                <div id="modalFilesList" class="space-y-3 pb-2">
                    <!-- Dynamic File List Appears Here -->
                    <div class="text-center text-slate-500 text-sm py-4">Loading...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'https://api.test.ai-ivrs.bonrix.in/new';
const SESSION_INIT_API = 'https://api.test.ai-ivrs.bonrix.in/new/api/session/init';

        let ws, audioCtx, stream, processor;
        let audioQueue = [];
        let isPlaying = false;
        let currentSource = null;
        let currentAIElem = null;
        let isMicActive = false;

        // ---- Load Files for Both Dropdown and Modal ----
        async function fetchAndRenderFiles() {
            try {
                const res = await fetch(`${API_BASE}/api/uploads?t=${Date.now()}`, { cache: 'no-store' });
                const data = await res.json();
                const list = data.files || [];
                
                // Update Main Dropdown
                const sel = document.getElementById('contextFile');
                const current = sel.value;
                sel.innerHTML = '<option value="">No Context File (Optional)</option>';
                list.forEach(f => {
                    const opt = document.createElement('option');
                    opt.value = f.name;
                    opt.textContent = f.name + (f.size ? ' (' + f.size + ')' : '');
                    sel.appendChild(opt);
                });
                if (current) sel.value = current;

                // Update Modal List
                const modalList = document.getElementById('modalFilesList');
                const modalCount = document.getElementById('modalFileCount');
                if(modalCount) modalCount.textContent = list.length;
                
                if(list.length === 0) {
                    modalList.innerHTML = '<div class="text-center border border-dashed border-slate-700 bg-slate-800/50 rounded-xl text-slate-500 text-sm py-8">No files uploaded yet.</div>';
                    return;
                }
                
                modalList.innerHTML = '';
                list.forEach(f => {
                    const dateStr = f.mtime ? new Date(f.mtime).toLocaleString() : '';
                    const div = document.createElement('div');
                    div.className = "flex items-center gap-3 bg-slate-800/40 border border-slate-700/50 p-3 rounded-xl hover:bg-slate-800/80 transition-all";
                    div.innerHTML = `
                        <div class="w-10 h-10 bg-blue-500/10 text-blue-400 rounded-lg flex items-center justify-center flex-shrink-0"><i class="fas fa-file-alt text-lg"></i></div>
                        <div class="flex-1 min-w-0">
                            <div class="text-sm font-semibold truncate text-slate-200" title="${f.name}">${f.name}</div>
                            <div class="text-xs text-slate-400 flex gap-3 mt-1"><span>${f.size || ''}</span><span>${dateStr}</span></div>
                        </div>
                        <div class="flex items-center gap-2 flex-shrink-0">
                            <a href="${f.url}" target="_blank" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-white text-xs font-semibold rounded-lg transition-all border border-slate-600">Open</a>
                            <button onclick="deleteContextFile('${f.name}')" class="px-3 py-1.5 bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 hover:border-red-500 text-xs font-semibold rounded-lg transition-all">Delete</button>
                        </div>
                    `;
                    modalList.appendChild(div);
                });
            } catch (e) {
                console.error('Could not load files', e);
                document.getElementById('modalFilesList').innerHTML = '<div class="text-center text-red-400 text-sm py-4">Error loading files</div>';
            }
        }

        document.getElementById('refreshFilesBtn').onclick = fetchAndRenderFiles;
        fetchAndRenderFiles(); // Initial Load

        async function deleteContextFile(name) {
            if(!confirm(`Are you sure you want to delete "${name}"?`)) return;
            try {
                const res = await fetch(`${API_BASE}/api/uploads/${encodeURIComponent(name)}`, { method: 'DELETE', cache: 'no-store' });
                const data = await res.json();
                if(data.success) {
                    showUploadMsg(`Deleted: ${name}`, false);
                    fetchAndRenderFiles(); // Refresh both dropdown and modal list
                } else {
                    showUploadMsg(data.message || 'Delete failed', true);
                }
            } catch(e) {
                showUploadMsg('Error: ' + e.message, true);
            }
        }

        // --- Core Gemini Logic ---
        function appendMessage(text, role) {
            const chatBox = document.getElementById('chatBox');
            const wrapper = document.createElement('div');
            wrapper.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'} animate-fade-in`;

            const content = role === 'ai' ?
                `<div class="flex gap-3 max-w-[85%]">
                    <div class="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center flex-shrink-0 mt-1"><i class="fas fa-robot text-xs"></i></div>
                    <div class="bubble-ai p-4 text-slate-200 leading-relaxed">${text}</div>
                 </div>` :
                `<div class="bubble-user p-4 max-w-[85%] text-white leading-relaxed">${text}</div>`;

            wrapper.innerHTML = content;
            chatBox.appendChild(wrapper);
            chatBox.scrollTop = chatBox.scrollHeight;
            return wrapper.querySelector(role === 'ai' ? '.bubble-ai' : '.bubble-user');
        }

        async function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
            if (audioCtx.state === 'suspended') await audioCtx.resume();
        }

        function queueAudio(base64) {
            const binary = atob(base64);
            const buffer = new Int16Array(binary.length / 2);
            for (let i = 0; i < buffer.length; i++) {
                buffer[i] = (binary.charCodeAt(i * 2) & 0xFF) | (binary.charCodeAt(i * 2 + 1) << 8);
            }
            audioQueue.push(buffer);
            if (!isPlaying) playNext();
        }

        async function playNext() {
            if (audioQueue.length === 0) { isPlaying = false; return; }
            isPlaying = true;
            await initAudio();
            const data = audioQueue.shift();
            const audioBuffer = audioCtx.createBuffer(1, data.length, 24000);
            const channel = audioBuffer.getChannelData(0);
            for (let i = 0; i < data.length; i++) channel[i] = data[i] / 32768;
            currentSource = audioCtx.createBufferSource();
            currentSource.buffer = audioBuffer;
            currentSource.connect(audioCtx.destination);
            currentSource.onended = playNext;
            currentSource.start();
        }

        function stopAudio() {
            audioQueue = [];
            if (currentSource) { try { currentSource.stop(); } catch(e) {} currentSource = null; }
            isPlaying = false;
        }

        async function connect() {
            const config = {
                userData: {
                    name: document.getElementById('userName').value,
                    email: document.getElementById('userEmail').value,
                    mobile: document.getElementById('userMobile').value
                },
                websiteName: "demo",
                language: document.getElementById('language').value,
                fileName: document.getElementById('contextFile').value
            };

            if (!config.userData.name) { alert("Please enter your name"); return; }
            document.getElementById('connectBtn').innerText = "Connecting...";

            try {
                const res = await fetch(SESSION_INIT_API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(config)
                });
                const data = await res.json();

                ws = new WebSocket(data.websocketUrl);

                ws.onopen = () => {
                    document.getElementById('setupSection').classList.add('hidden-section');
                    document.getElementById('chatSection').classList.remove('hidden-section');
                    document.getElementById('displaySite').innerText = "Bonrix Software systems";
                    document.getElementById('statusText').innerText = "Online";
                    document.getElementById('statusDot').className = "absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 border-2 border-slate-900 rounded-full";
                };

                ws.onmessage = (e) => {
                    const msg = JSON.parse(e.data);

                    if (msg.type === 'input_audio_buffer.speech_started') {
                        stopAudio();
                        ws.send(JSON.stringify({ type: 'response.cancel' }));
                    }

                    if (msg.type === 'response.audio.delta') queueAudio(msg.delta);

                    if (msg.type === 'conversation.item.input_audio_transcription.completed') {
                        appendMessage(msg.transcript, 'user');
                    }

                    if (msg.type === 'response.audio_transcript.delta') {
                        if (!currentAIElem) currentAIElem = appendMessage("", 'ai');
                        currentAIElem.innerText += msg.delta;
                        document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
                    }

                    if (msg.type === 'response.done') currentAIElem = null;
                };

                ws.onclose = () => disconnect();

            } catch (e) {
                alert("Connection failed. Check if server is running.");
                document.getElementById('connectBtn').innerText = "Initialize Session";
            }
        }

        async function toggleMic() {
            const btn = document.getElementById('micBtn');
            const icon = document.getElementById('micIcon');
            const hint = document.getElementById('micHint');
            const viz = document.getElementById('visualizer');

            if (isMicActive) {
                if (stream) stream.getTracks().forEach(t => t.stop());
                isMicActive = false;
                btn.className = "w-20 h-20 rounded-full bg-slate-700 hover:bg-slate-600 flex items-center justify-center mx-auto transition-all shadow-xl";
                icon.className = "fas fa-microphone text-3xl text-white";
                hint.innerText = "Click to resume";
                viz.classList.add('hidden');
            } else {
                await initAudio();
                stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const ctx = new AudioContext({ sampleRate: 24000 });
                const source = ctx.createMediaStreamSource(stream);
                processor = ctx.createScriptProcessor(4096, 1, 1);
                processor.onaudioprocess = (e) => {
                    const input = e.inputBuffer.getChannelData(0);
                    const pcm16 = new Int16Array(input.length);
                    for (let i = 0; i < input.length; i++) pcm16[i] = input[i] * 0x7FFF;
                    if (ws?.readyState === 1) ws.send(JSON.stringify({
                        type: "input_audio_buffer.append",
                        audio: btoa(String.fromCharCode(...new Uint8Array(pcm16.buffer)))
                    }));
                };
                source.connect(processor);
                processor.connect(ctx.destination);

                isMicActive = true;
                btn.className = "w-20 h-20 rounded-full bg-red-500 hover:bg-red-600 flex items-center justify-center mx-auto transition-all shadow-xl pulse-red";
                icon.className = "fas fa-stop text-3xl text-white";
                hint.innerText = "I'm listening...";
                viz.classList.remove('hidden');

                ws.send(JSON.stringify({ type: 'trigger.greeting' }));
            }
        }

        function disconnect() {
            if (ws) ws.close();
            if (stream) stream.getTracks().forEach(t => t.stop());
            window.location.reload();
        }

        // ===== UPLOAD MODAL LOGIC =====
        const uploadModal = document.getElementById('uploadModal');
        const modalFileInput = document.getElementById('modalFileInput');
        const dropZone = document.getElementById('dropZone');
        const selectedFileDiv = document.getElementById('selectedFileDiv');
        const modalSelName = document.getElementById('modalSelName');
        const modalSelSize = document.getElementById('modalSelSize');
        const modalUploadBtn = document.getElementById('modalUploadBtn');
        const modalClearBtn = document.getElementById('modalClearBtn');
        const uploadMsg = document.getElementById('uploadMsg');
        let chosenFile = null;

        function openUploadModal() {
            uploadModal.classList.remove('hidden-section');
            resetUploadModal();
        }

        function closeUploadModal() {
            uploadModal.classList.add('hidden-section');
        }

        document.getElementById('closeUploadModalBtn').addEventListener('click', closeUploadModal);

        function humanSize(bytes) {
            if(bytes < 1024) return bytes + ' B';
            if(bytes < 1048576) return (bytes/1024).toFixed(1) + ' KB';
            return (bytes/1048576).toFixed(2) + ' MB';
        }

        function showUploadMsg(text, isError) {
            uploadMsg.textContent = text;
            uploadMsg.className = `p-3 rounded-xl text-sm mb-4 font-medium text-center ${isError ? 'bg-red-500/10 text-red-400 border border-red-500/20' : 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20'}`;
            uploadMsg.classList.remove('hidden');
            setTimeout(() => uploadMsg.classList.add('hidden'), 4000);
        }

        function resetUploadModal() {
            chosenFile = null;
            modalFileInput.value = '';
            selectedFileDiv.classList.add('hidden');
            selectedFileDiv.classList.remove('flex');
            dropZone.classList.remove('hidden');
            modalUploadBtn.textContent = 'Upload';
            modalUploadBtn.disabled = false;
        }

        function pickFile(file) {
            chosenFile = file;
            modalSelName.textContent = file.name;
            modalSelSize.textContent = humanSize(file.size);
            selectedFileDiv.classList.remove('hidden');
            selectedFileDiv.classList.add('flex');
            dropZone.classList.add('hidden');
        }

        modalFileInput.addEventListener('change', e => { if(e.target.files[0]) pickFile(e.target.files[0]); });
        modalClearBtn.addEventListener('click', resetUploadModal);

        ['dragenter', 'dragover'].forEach(ev => dropZone.addEventListener(ev, e => {
            e.preventDefault(); dropZone.classList.add('border-blue-500', 'bg-slate-800/80');
        }));
        ['dragleave', 'drop'].forEach(ev => dropZone.addEventListener(ev, e => {
            e.preventDefault(); dropZone.classList.remove('border-blue-500', 'bg-slate-800/80');
        }));
        dropZone.addEventListener('drop', e => {
            if(e.dataTransfer.files[0]) pickFile(e.dataTransfer.files[0]);
        });

        modalUploadBtn.addEventListener('click', async () => {
            if(!chosenFile) return;
            modalUploadBtn.disabled = true;
            modalUploadBtn.textContent = 'Uploading...';
            const fd = new FormData();
            fd.append('file', chosenFile);
            try {
                const r = await fetch(`${API_BASE}/api/upload`, { method: 'POST', body: fd, cache: 'no-store' });
                const data = await r.json();
                if(data.success) {
                    showUploadMsg('File uploaded successfully!', false);
                    resetUploadModal(); // Reset drag drop section
                    fetchAndRenderFiles(); // Refresh lists
                } else {
                    showUploadMsg(data.message || 'Upload failed', true);
                    modalUploadBtn.disabled = false;
                    modalUploadBtn.textContent = 'Upload';
                }
            } catch(err) {
                showUploadMsg('Error: ' + err.message, true);
                modalUploadBtn.disabled = false;
                modalUploadBtn.textContent = 'Upload';
            }
        });
    </script>
</body>
</html>
