<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPI Management System</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, sans-serif;
            background: #f0f4ff;
            min-height: 100vh;
            padding: 24px;
            display: flex;
            gap: 20px;
            color: #1a1a2e;
        }

        .main-content {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .log-section {
            width: 320px;
            flex-shrink: 0;
            position: sticky;
            top: 24px;
            align-self: flex-start;
        }

        .card {
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 2px 12px rgba(80, 80, 180, 0.08);
            border: 1px solid #e4e8f8;
            padding: 24px;
            width: 100%;
        }

        h1 {
            text-align: center;
            font-size: 1.6em;
            color: #4f46e5;
            margin-bottom: 4px;
        }

        h2 {
            font-size: 1.1em;
            color: #1a1a2e;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e4e8f8;
        }

        h3 {
            font-size: 1em;
            color: #1a1a2e;
            margin-bottom: 12px;
        }

        /* Connection Status */
        .connection-status {
            padding: 10px 16px;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 16px;
        }
        .connected    { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
        .disconnected { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }

        .connect-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .connect-row label { font-size: 14px; color: #555; white-space: nowrap; }

        select {
            padding: 8px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            background: #f9fafb;
            color: #1a1a2e;
            cursor: pointer;
        }

        /* Buttons */
        button {
            padding: 9px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.3px;
            transition: opacity 0.2s, transform 0.15s;
        }
        button:hover:not(:disabled) { opacity: 0.88; transform: translateY(-1px); }
        button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

        .btn-primary { background: #4f46e5; color: #fff; }
        .btn-danger  { background: #ef4444; color: #fff; }
        .btn-success { background: #10b981; color: #fff; }
        .btn-ghost   { background: #f3f4f6; color: #374151; border: 1px solid #d1d5db; }

        /* Form */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 600;
            color: #374151;
        }

        .form-group input[type="text"] {
            width: 100%;
            min-width: 0;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            background: #f9fafb;
            color: #1a1a2e;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-group input[type="text"]:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79,70,229,0.12);
            background: #fff;
        }

        /* UPI list */
        .upi-list-wrap {
            background: #f7f8fc;
            border-radius: 10px;
            padding: 16px;
            margin-top: 16px;
            border: 1px solid #e4e8f8;
        }

        .upi-item {
            background: #fff;
            border: 1px solid #e4e8f8;
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            transition: box-shadow 0.2s;
        }
        .upi-item:last-child { margin-bottom: 0; }
        .upi-item:hover { box-shadow: 0 4px 12px rgba(79,70,229,0.1); }

        .upi-info { min-width: 0; flex: 1; }
        .upi-name { font-weight: 700; color: #1a1a2e; font-size: 15px; margin-bottom: 3px; }
        .upi-details { color: #6b7280; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .upi-actions { display: flex; gap: 8px; flex-shrink: 0; }
        .upi-actions button { padding: 6px 14px; font-size: 12px; }

        /* Command display */
        .command-display {
            background: #f0f4ff;
            border: 1px solid #c7d2fe;
            border-radius: 8px;
            padding: 12px;
            margin-top: 14px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #3730a3;
            word-break: break-all;
        }

        /* Status messages */
        .status-message {
            padding: 10px 14px;
            border-radius: 8px;
            margin-top: 12px;
            font-size: 14px;
            font-weight: 500;
        }
        .status-success { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
        .status-error   { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
        .status-info    { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }

        .empty-state {
            text-align: center;
            color: #9ca3af;
            font-size: 14px;
            padding: 30px;
        }

        /* Spinner */
        .loading {
            display: inline-block;
            width: 16px; height: 16px;
            border: 2px solid #c7d2fe;
            border-top-color: #4f46e5;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Log panel */
        .log-card {
            background: #1e1e2e;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
        }
        .log-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: #16162a;
            border-bottom: 1px solid #2d2d44;
        }
        .log-header h3 { color: #a5b4fc; font-size: 13px; font-weight: 600; margin: 0; }
        .log-header button { padding: 5px 12px; font-size: 12px; }
        #log {
            color: #e2e8f0;
            padding: 14px;
            height: calc(100vh - 120px);
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 11.5px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-all;
        }

        @media (max-width: 900px) {
            body { flex-direction: column; }
            .log-section { width: 100%; position: relative; top: 0; }
            #log { height: 240px; }
            .form-grid { grid-template-columns: 1fr; }
        }

        @media (max-width: 540px) {
            .form-grid { grid-template-columns: 1fr; }
            .connect-row { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>

<div class="main-content">

    <!-- Header + Connection -->
    <div class="card">
        <h1>UPI Management System</h1>
        <p style="text-align:center;color:#6b7280;font-size:13px;margin-bottom:18px;">Manage your UPI payment files over serial</p>

        <div id="connectionStatus" class="connection-status disconnected">Not connected</div>

        <div class="connect-row">
            <label for="baudRate">Baud Rate:</label>
            <select id="baudRate">
                <option value="115200">115200</option>
                <option value="230400">230400</option>
                <option value="250000">250000</option>
                <option value="460800">460800</option>
                <option value="500000">500000</option>
                <option value="921600" selected>921600</option>
            </select>
            <button id="connectBtn" class="btn-primary" onclick="connectSerial()">Connect</button>
            <button id="disconnectBtn" class="btn-ghost" onclick="disconnectSerial()" disabled>Disconnect</button>
        </div>
    </div>

    <!-- UPI Files Management -->
    <div class="card">
        <h2>UPI Files Management</h2>
        <button id="listUpiBtn" class="btn-primary" onclick="listUpi()" disabled>List UPI Files</button>

        <div id="upiListContainer" class="upi-list-wrap" style="display:none;">
            <h3>Available UPI Files</h3>
            <div id="upiList"><div class="empty-state">Click "List UPI Files" to load</div></div>
        </div>

        <div id="commandDisplay" class="command-display" style="display:none;">
            <strong>Last command:</strong> <span id="lastCommand"></span>
        </div>
    </div>

    <!-- View UPI Details -->
    <div class="card" id="viewUpiContainer" style="display:none;">
        <h2>UPI Details</h2>
        <div id="upiDetails"></div>
    </div>

    <!-- Add New UPI -->
    <div class="card">
        <h2>Add New UPI</h2>
        <form id="addUpiForm" onsubmit="handleAddUpi(event)">
            <div class="form-grid">
                <div class="form-group">
                    <label for="upiName">UPI Name <span style="color:#ef4444">*</span></label>
                    <input type="text" id="upiName" placeholder="e.g., paytm" required>
                </div>
                <div class="form-group">
                    <label for="upiId">UPI ID <span style="color:#ef4444">*</span></label>
                    <input type="text" id="upiId" placeholder="e.g., user@okaxis" required>
                </div>
                <div class="form-group">
                    <label for="merchantName">Merchant Name <span style="color:#9ca3af">(optional)</span></label>
                    <input type="text" id="merchantName" placeholder="e.g., Jatin">
                </div>
                <div class="form-group">
                    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;">
                        <label for="upiUrl" style="margin-bottom:0;">UPI URL <span style="color:#ef4444">*</span></label>
                        <select id="upiUrlExample" onchange="applyExampleUrl(this)" title="Pick an example URL" style="width:120px;padding:4px 8px;border:1px solid #c7d2fe;border-radius:6px;font-size:11.5px;background:#f5f3ff;color:#4f46e5;cursor:pointer;font-weight:600;">
                            <option value="" disabled selected>💡 Examples</option>
                            <option value="upi://pay?pa=6327000000.payswiff@indus&pn=Bonrix&cu=INR&am=10&pn=Bonrix%20Software%20Systems">Example 1</option>
                            <option value="upi://pay?pa=1234567890@icici&pn=M/S.BONRIX SOFTWARE SYSTEMS&tr=EZYS12345&cu=INR&mc=5411">Example 2</option>
                            <option value="upi://pay?pa=2365987445-1@okicici&pn=examplename&aid=uGICAgMCCxpPmWA">Example 3</option>
                        </select>
                    </div>
                    <input type="text" id="upiUrl" placeholder="upi://pay?pa=..." required style="width:100%;">
                </div>
            </div>
            <button type="submit" id="addUpiBtn" class="btn-success" disabled>Add UPI</button>
        </form>
        <div id="addUpiStatus"></div>
    </div>

</div>

<!-- Log Panel -->
<div class="log-section">
    <div class="log-card">
        <div class="log-header">
            <h3>Console Log</h3>
            <button class="btn-ghost" onclick="clearLog()">Clear</button>
        </div>
        <div id="log">Ready...\n</div>
    </div>
</div>

<script>
    let port, writer, reader;
    let responseBuffer = '';
    let fullResponse = '';
    let responseTimeout;

    function log(msg, type = 'info') {
        const logDiv = document.getElementById('log');
        const ts = new Date().toLocaleTimeString();
        const colors = { info:'#a5b4fc', error:'#f87171', success:'#34d399', warning:'#fbbf24' };
        const color = colors[type] || '#a5b4fc';
        logDiv.innerHTML += `<span style="color:${color}">[${ts}] ${msg}</span>\n`;
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    function clearLog() { document.getElementById('log').innerHTML = ''; }

    function updateConnectionStatus(connected) {
        const el = document.getElementById('connectionStatus');
        el.textContent = connected ? 'Connected' : 'Not connected';
        el.className = 'connection-status ' + (connected ? 'connected' : 'disconnected');
    }

    function showCommand(cmd) {
        document.getElementById('lastCommand').textContent = cmd;
        document.getElementById('commandDisplay').style.display = 'block';
    }

    function showStatus(elId, msg, type) {
        const el = document.getElementById(elId);
        el.className = 'status-message status-' + type;
        el.textContent = msg;
        el.style.display = 'block';
        setTimeout(() => el.style.display = 'none', 5000);
    }

    function setConnectedUI(connected) {
        updateConnectionStatus(connected);
        document.getElementById('connectBtn').disabled = connected;
        document.getElementById('disconnectBtn').disabled = !connected;
        document.getElementById('listUpiBtn').disabled = !connected;
        document.getElementById('addUpiBtn').disabled = !connected;
    }

    async function connectSerial() {
        try {
            const baudRate = parseInt(document.getElementById('baudRate').value, 10);
            port = await navigator.serial.requestPort();
            await port.open({ baudRate });
            writer = port.writable.getWriter();
            log(`Connected at ${baudRate} baud`, 'success');
            setConnectedUI(true);
            readLoop();
        } catch (e) { log('Error: ' + e.message, 'error'); }
    }

    async function disconnectSerial() {
        try {
            writer?.releaseLock(); writer = null;
            reader?.releaseLock(); reader = null;
            await port?.close(); port = null;
            log('Disconnected', 'success');
            setConnectedUI(false);
        } catch (e) { log('Error: ' + e.message, 'error'); }
    }

    async function send(cmd) {
        await writer.write(new TextEncoder().encode(cmd + '\n'));
        log('Sent: ' + cmd, 'info');
        showCommand(cmd);
    }

    async function listUpi() {
        try {
            fullResponse = '';
            await send('listupi');
            const container = document.getElementById('upiListContainer');
            container.style.display = 'block';
            document.getElementById('upiList').innerHTML = '<span class="loading"></span>Loading...';
            clearTimeout(responseTimeout);
            responseTimeout = setTimeout(() => { log('Timeout — processing data', 'warning'); processUpiListResponse(); }, 5000);
        } catch (e) { log('Error: ' + e.message, 'error'); }
    }

    async function deleteUpi(name) {
        if (!confirm(`Delete ${name}?`)) return;
        try {
            await send(`deleteupi**${name}.txt`);
            setTimeout(listUpi, 1000);
        } catch (e) { log('Error: ' + e.message, 'error'); }
    }

    async function viewUpi(name) {
        try {
            fullResponse = '';
            await send(`viewupi**${name}.txt`);
            const container = document.getElementById('viewUpiContainer');
            container.style.display = 'block';
            const details = document.getElementById('upiDetails');
            if (details.dataset.currentUpi !== name) {
                details.innerHTML = '<span class="loading"></span>Loading...';
                details.dataset.currentUpi = name;
            }
            clearTimeout(responseTimeout);
            responseTimeout = setTimeout(() => {
                log('Timeout for UPI details', 'warning');
                if (details.dataset.currentUpi === name)
                    details.innerHTML = '<div class="status-message status-error">Timeout loading details</div>';
            }, 5000);
        } catch (e) { log('Error: ' + e.message, 'error'); }
    }

    async function addUpi(name, id, merchant, url) {
        try {
            await send(`addupi**${name}**${id}**${merchant}**${url}`);
            showStatus('addUpiStatus', 'UPI added successfully!', 'success');
            document.getElementById('addUpiForm').reset();
            setTimeout(listUpi, 1000);
        } catch (e) {
            log('Error: ' + e.message, 'error');
            showStatus('addUpiStatus', 'Error: ' + e.message, 'error');
        }
    }

    function applyExampleUrl(select) {
        if (!select.value) return;
        const input = document.getElementById('upiUrl');
        input.value = select.value;
        input.focus();
        input.style.borderColor = '#4f46e5';
        input.style.boxShadow = '0 0 0 3px rgba(79,70,229,0.15)';
        setTimeout(() => { input.style.borderColor = ''; input.style.boxShadow = ''; }, 1500);
        select.selectedIndex = 0;
        log('Example URL applied to UPI URL field', 'info');
    }

    function handleAddUpi(e) {
        e.preventDefault();
        const name     = document.getElementById('upiName').value.trim();
        const id       = document.getElementById('upiId').value.trim();
        const merchant = document.getElementById('merchantName').value.trim();
        const url      = document.getElementById('upiUrl').value.trim();
        if (!name || !id || !url) { showStatus('addUpiStatus', 'Fill in all required fields', 'error'); return; }
        addUpi(name, id, merchant, url);
    }

    function processUpiListResponse() {
        clearTimeout(responseTimeout);
        const upiList = document.getElementById('upiList');
        const lines = fullResponse.split('\n');
        const files = [];
        for (const line of lines) {
            const t = line.trim();
            if (t.includes('.txt') && t.includes('|')) {
                const parts = t.split('|');
                if (parts.length >= 2) {
                    const filename = parts[0].trim();
                    files.push({ name: filename.replace('.txt',''), filename, size: parts[1].trim() });
                }
            }
        }
        if (!files.length) { upiList.innerHTML = '<div class="empty-state">No UPI files found</div>'; return; }
        upiList.innerHTML = files.map(f => `
            <div class="upi-item">
                <div class="upi-info">
                    <div class="upi-name">${f.name}</div>
                    <div class="upi-details">${f.filename} &nbsp;·&nbsp; ${f.size}</div>
                </div>
                <div class="upi-actions">
                    <button class="btn-primary" onclick="viewUpi('${f.name}')">View</button>
                    <button class="btn-danger"  onclick="deleteUpi('${f.name}')">Delete</button>
                </div>
            </div>`).join('');
        log(`Found ${files.length} UPI file(s)`, 'success');
    }

    function processUpiViewResponse() {
        clearTimeout(responseTimeout);
        log('Processing UPI view response...', 'info');
        try {
            const upiname    = fullResponse.match(/"upiname":\s*"([^"]+)"/)?.[1] || 'N/A';
            const upiid      = fullResponse.match(/"upiid":\s*"([^"]+)"/)?.[1] || 'N/A';
            const merchantname = fullResponse.match(/"merchant(?:name|name)":\s*"([^"]+)"/i)?.[1]
                              || fullResponse.match(/"merchanname":\s*"([^"]+)"/)?.[1] || 'N/A';
            const upiurl     = fullResponse.match(/"upiurl":\s*"([^"]+)"/)?.[1] || 'N/A';
            displayUpiDetails({ upiname, upiid, merchantname, upiurl });
        } catch (e) {
            log('Parse error: ' + e.message, 'error');
            document.getElementById('upiDetails').innerHTML = `<div class="status-message status-error">Error parsing data</div>`;
        }
    }

    function displayUpiDetails(d) {
        const json = JSON.stringify({ upiname: d.upiname, upiid: d.upiid, merchantname: d.merchantname, upiurl: d.upiurl }, null, 2);
        document.getElementById('upiDetails').innerHTML = `
            <div class="upi-item" style="margin-bottom:16px;">
                <div class="upi-info">
                    <div class="upi-name">${d.upiname}</div>
                    <div class="upi-details">
                        <strong>UPI ID:</strong> ${d.upiid}<br>
                        <strong>Merchant:</strong> ${d.merchantname}<br>
                        <strong>URL:</strong> ${d.upiurl}
                    </div>
                </div>
            </div>
            <pre style="background:#f7f8fc;border:1px solid #e4e8f8;border-radius:8px;padding:14px;font-size:13px;color:#374151;overflow-x:auto;">${json}</pre>`;
        document.getElementById('viewUpiContainer').style.display = 'block';
        setTimeout(() => document.getElementById('viewUpiContainer').scrollIntoView({ behavior:'smooth', block:'start' }), 100);
        log('UPI details displayed', 'success');
    }

    async function readLoop() {
        if (!port) return;
        try {
            reader = port.readable.getReader();
            const decoder = new TextDecoder();
            while (true) {
                const { value, done } = await reader.read();
                if (done) break;
                const chunk = decoder.decode(value);
                fullResponse += chunk;
                responseBuffer += chunk;
                let lines = responseBuffer.split('\n');
                responseBuffer = lines.pop();
                for (const line of lines) {
                    const t = line.trim();
                    if (!t) continue;
                    log('Recv: ' + t, 'success');
                    if (t.includes('Total UPI files:')) processUpiListResponse();
                    if (t.includes('---------------------------') &&
                        fullResponse.includes('"upiname"') && fullResponse.includes('"upiid"') &&
                        (fullResponse.includes('"merchantname"') || fullResponse.includes('"merchanname"')) &&
                        fullResponse.includes('"upiurl"'))
                        processUpiViewResponse();
                }
            }
        } catch (err) { log('Read error: ' + err.message, 'error'); }
        finally { reader?.releaseLock(); reader = null; }
    }

    document.addEventListener('DOMContentLoaded', () => {
        log('UPI Management System ready', 'success');
        setConnectedUI(false);
    });
</script>
</body>
</html>
